<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <!-- Dark is the default, so without this every load paints white first
         and then corrects itself once React mounts. Reads the same key
         next-themes writes, and asks the same question of the browser.

         Asking the same question matters: `light` and `dark` are not each
         other's negation. A browser may answer `no-preference`, and then
         both queries are false. This used to probe `light` while
         next-themes probes `dark`, so on such a browser, with "Match the
         system" chosen, this painted dark and next-themes then resolved
         light — a black flash on every load. -->
    <!-- Its own file: the CSP the server sends (script-src 'self') refuses
         inline scripts. Classic and blocking on purpose, so it runs before
         anything is painted. -->
    <script src="/theme-init.js"></script>
    <title>Sales Tracker</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
