<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <!-- Dark is the default, so without this every load paints white first
         and then corrects itself once React mounts. Reads the same key
         next-themes writes, so the two never disagree. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cetizion.theme');
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var mode = stored === 'light' || stored === 'dark' ? stored : stored === 'system' ? system : 'dark';
          document.documentElement.classList.toggle('dark', mode === 'dark');
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Cetizion — Sales, Projects & Expenses</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
