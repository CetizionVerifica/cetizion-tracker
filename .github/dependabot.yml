# Dependency updates (#37): one grouped pull request a week per package
# set, so a run of small bumps is one review, not twenty.
#
# Not covered here: server's `xlsx`, which is installed from SheetJS's own
# site because npm's copy stopped at 0.18.5 and carries two HIGH advisories
# fixed after it. Dependabot cannot see that package, so a person checks
# sheetjs.com at the quarterly access review. See docs/security.md section 5
# before changing how it is installed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    groups:
      server-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
