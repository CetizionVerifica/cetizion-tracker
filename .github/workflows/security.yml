# Supply-chain and code scanning (#37). Runs on every pull request, every
# push to main, and once a week so a vulnerability published after the last
# change is still noticed.
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        # High and critical fail the check; moderate and below are reported only.
        run: npm audit --omit=dev --audit-level=high
  codeql:
    name: Code scanning (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
  secrets:
    name: Secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  container:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag cetizion-tracker:scan .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cetizion-tracker:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
