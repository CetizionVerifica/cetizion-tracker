# Supply-chain and code scanning (#37). Runs on every pull request, every
# push to main, and once a week so a vulnerability published after the last
# change is still noticed. A pull request fails the dependency audit only for
# an advisory it adds; main and the weekly run fail for any.
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    strategy:
      # Each folder reports for itself: one failing must not cancel the other.
      fail-fast: false
      matrix:
        dir: [server, web]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # On main and the weekly run: any high or critical advisory fails, so
      # one published since the last change is noticed. Moderate and below
      # are reported only.
      - name: Audit ${{ matrix.dir }}
        if: github.event_name != 'pull_request'
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high
      # On a pull request: only an advisory the pull request adds fails. One
      # published against a package main already has shows as a warning; it
      # is not the pull request's doing, and Dependabot's security update
      # fixes it (scripts/ci/new-advisories.mjs).
      - name: Audit ${{ matrix.dir }} (what this pull request adds)
        if: github.event_name == 'pull_request'
        working-directory: ${{ matrix.dir }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git show "$BASE_SHA:${{ matrix.dir }}/package.json" > "$base/package.json"
          git show "$BASE_SHA:${{ matrix.dir }}/package-lock.json" > "$base/package-lock.json"
          (cd "$base" && npm audit --omit=dev --json > "$RUNNER_TEMP/base-audit.json") || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/head-audit.json" || true
          node ../scripts/ci/new-advisories.mjs "$RUNNER_TEMP/base-audit.json" "$RUNNER_TEMP/head-audit.json"
  codeql:
    name: Code scanning (CodeQL)
    # Code scanning on a private repository needs GitHub Advanced Security.
    # Once it is on, set the repository variable CODEQL_ENABLED=true.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
  secrets:
    name: Secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI itself (the GitHub Action needs a paid licence for
      # organisation repositories). Scans the whole history.
      - name: Scan the history for secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose
  container:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag cetizion-tracker:scan .
      # The whole image is scanned. npm used to be skipped here because its
      # bundled packages trail upstream fixes; it is no longer in the image
      # at all, so there is nothing to skip.
      # On a pull request, the operating system's packages only: the app's
      # npm packages in the image are the dependency audit's, which fails a
      # pull request only for an advisory it adds. Main and the weekly run
      # scan everything.
      - name: Scan the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image --exit-code 1 --ignore-unfixed
          --severity CRITICAL,HIGH --no-progress
          ${{ github.event_name == 'pull_request' && '--pkg-types os' || '' }}
          cetizion-tracker:scan
